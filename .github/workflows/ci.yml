name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: lint + tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format check)
        run: ruff format --check .

      - name: Pytest
        env:
          MPLBACKEND: Agg
        # xdist: the suite is dominated by AppTest cases (~30 s each, 60+ of
        # them). loadscope hands out whole modules so each module-scoped
        # fixture (a solved default geometry, 30-60 s) runs once instead of
        # once per worker -- measured 5m48 vs 10m25 for plain `load` on 4
        # workers (serial: 20m50).
        run: pytest tests/ -v --color=yes -n auto --dist loadscope
